<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faf8">
  <title>知页 · 专业课知识问答</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%232c654f'/%3E%3Ctext x='24' y='33' text-anchor='middle' fill='white' font-size='30'%3E知%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=1">
  <link rel="stylesheet" href="/static/typography.css?v=2">
  <script src="/static/chat.js?v=2" defer></script>
</head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/><path d="M12 6v14M6 9h3m-3 4h3m6-4h3m-3 4h3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 12h7"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m6 12 6-6 6 6M12 6v14"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8m-8 4h6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>
<div id="overlay" class="overlay" hidden></div>
<aside class="sidebar" id="sidebar" aria-label="对话导航">
  <a class="brand" href="/" aria-label="知页首页"><span class="brand-mark"><svg><use href="#i-book"/></svg></span><span>知页<span class="brand-en">STUDY COMPANION</span></span></a>
  <button id="new-chat" class="new-chat"><svg><use href="#i-plus"/></svg>开始新对话<span>↗</span></button>
  <div class="side-section"><span>最近对话</span><span id="session-count">0</span></div>
  <nav id="session-list" class="session-list" aria-label="历史对话"><p class="empty-history">还没有对话<br>从一个好问题开始吧</p></nav>
  <div class="sidebar-bottom">
    <div class="library-card"><svg><use href="#i-book"/></svg><div><strong>我的课程知识库</strong><p>操作系统 / 计算机组成原理</p></div></div>
    <div class="local-status"><span class="dot"></span><span>本地运行 · 数据保存在本机</span></div>
  </div>
</aside>
<div class="workspace">
  <header class="topbar">
    <div class="breadcrumb"><button id="menu-button" class="icon-button mobile-menu" aria-label="打开或关闭对话导航"><svg><use href="#i-menu"/></svg></button><span>学习空间</span><span class="slash">/</span><strong>知识库问答</strong></div>
    <div class="topbar-actions"><span class="status-badge" id="health-status"><span class="dot"></span><span>正在连接</span></span><a href="/docs" target="_blank" rel="noopener" class="docs-link">接口文档 ↗</a></div>
  </header>
  <main id="main" class="main">
    <section id="welcome" class="welcome">
      <div class="welcome-label"><span class="tiny-rule"></span>让知识，有迹可循</div>
      <h1>把疑问留在这里，<br>让理解再进一步<span>。</span></h1>
      <p class="welcome-description">从你的课程讲义中寻找答案。<br>每一次追问，都有上下文；每一个结论，都能回到原文。</p>
      <div class="topics"><span><span class="dot"></span>操作系统</span><span><span class="dot"></span>计算机组成原理</span><span class="muted">基于已导入的讲义</span></div>
      <div class="suggestion-label">不知道从哪里开始？试着问问</div>
      <div class="suggestions">
        <button class="suggestion" data-question="进程和线程有什么区别？"><span class="suggestion-icon">01</span><strong>理解一个概念</strong><span>进程和线程有什么区别？</span><svg><use href="#i-chevron"/></svg></button>
        <button class="suggestion" data-question="死锁发生的四个必要条件是什么？"><span class="suggestion-icon">02</span><strong>梳理知识要点</strong><span>死锁发生需要哪些条件？</span><svg><use href="#i-chevron"/></svg></button>
        <button class="suggestion" data-question="Cache 如何利用程序的局部性？"><span class="suggestion-icon">03</span><strong>弄懂背后的原理</strong><span>Cache 如何利用程序的局部性？</span><svg><use href="#i-chevron"/></svg></button>
      </div>
      <div class="workflow"><span>检索讲义</span><span>→</span><span>结合上下文</span><span>→</span><span>回答并标注来源</span></div>
    </section>
    <section id="messages" class="messages" aria-label="问答记录" aria-live="polite" aria-relevant="additions" hidden></section>
  </main>
  <footer class="composer-area">
    <div id="notice" class="notice" role="status" hidden></div>
    <form id="chat-form" class="composer">
      <label class="sr-only" for="question">输入你的课程问题</label>
      <textarea id="question" placeholder="问一个问题，也可以接着上一轮追问…" rows="2" maxlength="2000"></textarea>
      <div class="composer-toolbar"><div class="composer-info"><svg><use href="#i-book"/></svg><span>课程知识库</span><span class="divider"></span><label for="top-k">检索片段</label><select id="top-k"><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option></select></div><div class="send-controls"><span id="input-hint">Enter 发送 · Shift + Enter 换行</span><button id="stop-button" class="stop-button" type="button" hidden>停止生成</button><button id="send-button" class="send-button" type="submit" aria-label="发送问题" disabled><svg><use href="#i-arrow"/></svg></button></div></div>
    </form>
    <div class="footer-note"><span id="model-label">由 Ollama 本地模型提供支持</span><span>回答可能存在偏差，请结合引用原文核对</span></div>
  </footer>
</div>
</body>
</html>
